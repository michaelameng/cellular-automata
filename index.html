<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cellular Automata</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #1a1a1a;
        --muted: #565656;
        --line: #d8d8d8;
        --panel: #f5f4f1;
        --alive: #2563eb;
      }
      body {
        margin: 0;
        background: #ffffff;
        color: var(--ink);
        font-family: Georgia, "Times New Roman", serif;
        line-height: 1.5;
      }
      main {
        margin-inline: auto;
        width: 100%;
        max-width: 1000px;
        padding: 2.5rem 1.25rem 3.5rem;
        box-sizing: border-box;
      }
      .site-name {
        font-size: 20px;
        font-weight: bold;
        margin-bottom: 1.75rem;
      }
      .site-name a {
        color: inherit;
        text-decoration: none;
      }
      .site-name a:hover {
        text-decoration: underline;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 32px;
        font-weight: bold;
      }
      p {
        color: var(--muted);
        max-width: 60ch;
      }
      a {
        color: #1a3fb0;
      }
      #rule-picker {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        align-items: flex-start;
        margin: 1.5rem 0;
        padding: 1rem 1.25rem;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 6px;
      }
      .rule-row {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        flex-wrap: wrap;
      }
      .rule-row span.label {
        min-width: 4.5rem;
        color: var(--ink);
        font-weight: bold;
      }
      .rule-row label {
        display: inline-flex;
        align-items: center;
        gap: 0.25rem;
        font-size: 0.9rem;
        color: var(--muted);
      }
      #mutation-row input[type="range"] {
        width: 12rem;
        accent-color: var(--ink);
      }
      #mutation-value {
        min-width: 3rem;
        font-variant-numeric: tabular-nums;
        color: var(--ink);
      }
      #grid {
        display: grid;
        grid-template-columns: repeat(27, 1fr);
        gap: 0;
        margin: 1.5rem 0;
        padding: 0;
        background: #ffffff;
        border: 1px solid var(--line);
        border-radius: 4px;
        overflow: hidden;
      }
      /* A thin inset outline draws the grid lines without adding real layout gaps, so they stay hairline-thin at any cell size. */
      .cell {
        aspect-ratio: 1;
        min-width: 0;
        min-height: 0;
        padding: 0;
        border: 0;
        border-radius: 0;
        cursor: pointer;
        background: #ffffff;
        box-shadow: inset 0 0 0 1px #ececec;
      }
      .cell.alive {
        background: var(--alive);
        box-shadow: inset 0 0 0 1px #ececec;
      }
      #controls {
        margin: 1rem 0;
      }
      button {
        margin: 0.25rem 0.25rem 0.25rem 0;
        padding: 0.55rem 0.9rem;
        border: 1px solid var(--line);
        border-radius: 4px;
        background: #ffffff;
        color: var(--ink);
        font: inherit;
        cursor: pointer;
      }
      button:hover {
        background: var(--panel);
      }
      button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      #controls button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0.55rem;
      }
      #controls button svg {
        width: 1.15rem;
        height: 1.15rem;
        display: block;
      }
      #status {
        min-height: 1.5em;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
    </style>
  </head>
  <body>
    <!-- GitHub Pages serves this root index file as the project-page entry point. -->
    <main>
      <h1>Cellular Automata</h1>
      <p>
        Click cells to edit. Choose which live-neighbour counts cause birth (B)
        and survival (S), and set a mutation chance to randomly flip cells each
        generation.
      </p>
      <div id="rule-picker">
        <div class="rule-row" id="birth-row">
          <span class="label">Birth</span>
        </div>
        <div class="rule-row" id="survival-row">
          <span class="label">Survival</span>
        </div>
        <div class="rule-row" id="mutation-row">
          <span class="label">Mutation</span>
          <input
            type="range"
            id="mutation-probability"
            min="0"
            max="1"
            step="0.01"
            value="0"
          />
          <span id="mutation-value">0%</span>
        </div>
      </div>
      <div id="grid" role="grid" aria-label="Cellular automaton grid"></div>
      <div id="controls">
        <button
          id="step-back"
          title="Step back"
          aria-label="Step back"
          disabled
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <polygon points="19 20 9 12 19 4 19 20" />
            <line x1="5" y1="19" x2="5" y2="5" />
          </svg>
        </button>
        <button id="play" title="Play" aria-label="Play" disabled>
          <svg viewBox="0 0 24 24" fill="currentColor" stroke="none">
            <polygon points="5 3 19 12 5 21 5 3" />
          </svg>
        </button>
        <button
          id="step-forward"
          title="Step forward"
          aria-label="Step forward"
          disabled
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <polygon points="5 4 15 12 5 20 5 4" />
            <line x1="19" y1="5" x2="19" y2="19" />
          </svg>
        </button>
        <button id="random" title="Randomize" aria-label="Randomize" disabled>
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="3" y="3" width="18" height="18" rx="3" />
            <circle cx="8" cy="8" r="1.2" fill="currentColor" stroke="none" />
            <circle cx="16" cy="16" r="1.2" fill="currentColor" stroke="none" />
            <circle cx="12" cy="12" r="1.2" fill="currentColor" stroke="none" />
            <circle cx="8" cy="16" r="1.2" fill="currentColor" stroke="none" />
            <circle cx="16" cy="8" r="1.2" fill="currentColor" stroke="none" />
          </svg>
        </button>
        <button id="reset" title="Reset" aria-label="Reset" disabled>
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <polyline points="1 4 1 10 7 10" />
            <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10" />
          </svg>
        </button>
      </div>
      <p id="status">Loading Python runtime&hellip;</p>
    </main>
    <script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
    <script>
      // This page holds no simulation state of its own. Pyodide loads a real
      // CPython interpreter compiled to WebAssembly, we load the *actual*
      // src/game_of_life/life.py and state.py files into it unmodified, and
      // every action below calls into that live Python object. GitHub Pages
      // can host this because it's still just static files being fetched.
      const grid = document.querySelector("#grid"),
        status = document.querySelector("#status");
      const mutationSlider = document.querySelector("#mutation-probability");
      const mutationValue = document.querySelector("#mutation-value");
      const playButton = document.querySelector("#play");
      const playIcon = playButton.innerHTML;
      const pauseIcon =
        '<svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>';
      const controlButtons = [...document.querySelectorAll("#controls button")];
      let timer = null,
        applyingRemoteRule = false,
        pyState = null;

      function buildRuleCheckboxes(rowId, prefix) {
        const row = document.querySelector(rowId);
        for (let n = 0; n <= 8; n++) {
          const label = document.createElement("label");
          const box = document.createElement("input");
          box.type = "checkbox";
          box.id = `${prefix}-${n}`;
          box.onchange = onRuleCheckboxChange;
          label.append(box, document.createTextNode(String(n)));
          row.appendChild(label);
        }
      }
      function onRuleCheckboxChange() {
        if (applyingRemoteRule) return; // don't re-apply while syncing checkboxes from Python's state
        const birth = [...document.querySelectorAll('[id^="birth-"]')]
          .filter((b) => b.checked)
          .map((b) => +b.id.split("-")[1]);
        const survival = [...document.querySelectorAll('[id^="survival-"]')]
          .filter((b) => b.checked)
          .map((b) => +b.id.split("-")[1]);
        pyState.set_rule(birth, survival);
        render(readState());
      }
      buildRuleCheckboxes("#birth-row", "birth");
      buildRuleCheckboxes("#survival-row", "survival");

      mutationSlider.oninput = () => {
        if (applyingRemoteRule) return; // don't re-apply while syncing the slider from Python's state
        const probability = +mutationSlider.value;
        mutationValue.textContent = `${Math.round(probability * 100)}%`;
        pyState.set_mutation_probability(probability);
        render(readState());
      };

      function syncRuleCheckboxes(birth, survival) {
        applyingRemoteRule = true;
        for (let n = 0; n <= 8; n++) {
          document.querySelector(`#birth-${n}`).checked = birth.includes(n);
          document.querySelector(`#survival-${n}`).checked =
            survival.includes(n);
        }
        applyingRemoteRule = false;
      }

      function syncMutationSlider(probability) {
        applyingRemoteRule = true;
        mutationSlider.value = probability;
        mutationValue.textContent = `${Math.round(probability * 100)}%`;
        applyingRemoteRule = false;
      }

      // pyState.as_json() returns a PyProxy wrapping a Python dict; toJs()
      // recursively converts it (and the nested lists) into plain JS values.
      function readState() {
        return pyState.as_json().toJs({ dict_converter: Object.fromEntries });
      }

      function render(state) {
        grid.replaceChildren(
          ...state.cells.flatMap((row, y) =>
            row.map((alive, x) => {
              const cell = document.createElement("button");
              cell.className = `cell${alive ? " alive" : ""}`;
              cell.setAttribute(
                "aria-label",
                `Column ${x + 1}, row ${y + 1}: ${alive ? "alive" : "dead"}`,
              );
              cell.onclick = () => {
                stop();
                pyState.toggle(x, y);
                render(readState());
              };
              return cell;
            }),
          ),
        );
        status.textContent = `step: ${state.generation} · living cells: ${state.livingCells}`;
        syncRuleCheckboxes(state.birth, state.survival);
        syncMutationSlider(state.mutationProbability);
      }

      function stop() {
        clearInterval(timer);
        timer = null;
        playButton.innerHTML = playIcon;
        playButton.title = "Play";
        playButton.setAttribute("aria-label", "Play");
      }
      function stepForward() {
        pyState.step_forward();
        render(readState());
      }

      document.querySelector("#step-forward").onclick = () => {
        stop();
        stepForward();
      };
      document.querySelector("#step-back").onclick = () => {
        stop();
        pyState.step_back();
        render(readState());
      };
      playButton.onclick = () => {
        if (timer) return stop();
        timer = setInterval(stepForward, 450);
        playButton.innerHTML = pauseIcon;
        playButton.title = "Pause";
        playButton.setAttribute("aria-label", "Pause");
      };
      document.querySelector("#random").onclick = () => {
        stop();
        pyState.randomize();
        render(readState());
      };
      document.querySelector("#reset").onclick = () => {
        stop();
        pyState.reset();
        render(readState());
      };

      async function boot() {
        // Track which stage we're in so a failure's message can name it.
        let stage = "loading the Pyodide runtime";
        try {
          const pyodide = await loadPyodide();
          // Fetch the real package files and write them into Pyodide's virtual
          // filesystem under their actual package layout, so life.py's and
          // state.py's own relative imports (`from .life import ...`) work
          // unchanged — this runs the repository's files, not a copy of them.
          stage = "fetching the simulation source files";
          status.textContent = "Fetching simulation source…";
          const files = ["__init__.py", "life.py", "state.py"];
          const sources = await Promise.all(
            files.map((name) =>
              fetch(`src/game_of_life/${name}`, { cache: "no-store" }).then(
                (r) => {
                  if (!r.ok) throw new Error(`${name} failed: ${r.status}`);
                  return r.text();
                },
              ),
            ),
          );
          pyodide.FS.mkdirTree("/home/pyodide/game_of_life");
          files.forEach((name, i) =>
            pyodide.FS.writeFile(
              `/home/pyodide/game_of_life/${name}`,
              sources[i],
            ),
          );
          stage = "starting the Python interpreter";
          status.textContent = "Starting interpreter…";
          pyodide.runPython(`
import sys
sys.path.insert(0, "/home/pyodide")
from game_of_life.state import SimulationState
`);
          pyState = pyodide.globals.get("SimulationState")();
          controlButtons.forEach((b) => (b.disabled = false));
          render(readState());
        } catch (err) {
          // Surface the real error and the stage it happened in. The most
          // common cause is opening this file directly (file://), where the
          // browser blocks fetch() of the local source files — so point at a
          // web server in that case, and at the CDN connection otherwise.
          const hint =
            location.protocol === "file:"
              ? "Open this page through a web server (run `python3 -m http.server` in " +
                "the project folder and visit the printed URL), not directly from a file."
              : "Check your connection to the Pyodide CDN and reload.";
          status.textContent = `Could not start the Python runtime while ${stage}: ${err.message}. ${hint}`;
          console.error(err);
          throw err;
        }
      }
      boot();
    </script>
  </body>
</html>
